<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Little Adventures ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff8fb;color:#332a30}
button,input,select{font:inherit}.hero{padding:55px 20px;text-align:center;background:linear-gradient(135deg,#ffe4ee,#fff1d8)}
.hero h1{font-size:clamp(40px,8vw,72px);letter-spacing:-3px;margin:8px}.hero p{color:#765f69}.wrap{max-width:950px;margin:-25px auto 50px;padding:0 16px}.card{background:white;border:1px solid #f0e1e7;border-radius:24px;padding:24px;box-shadow:0 15px 45px #8f526615}
.hidden{display:none}.auth{max-width:430px;margin:25px auto}.auth h2{text-align:center}.field{display:grid;gap:7px;margin:12px 0}.field input{padding:13px;border:1px solid #eadbe1;border-radius:12px}.btn{border:0;border-radius:12px;padding:12px 17px;background:#e85b7b;color:white;font-weight:700;cursor:pointer}.btn.alt{background:#fff0f4;color:#a43e5a}.msg{text-align:center;color:#8a6572;min-height:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{text-align:center;background:#fff8fa;border-radius:17px;padding:17px}.stat b{display:block;font-size:27px}.stat small{color:#8b747d}.add{display:grid;grid-template-columns:1fr 160px auto;gap:9px;margin:20px 0}.add input,.add select,.search{padding:12px;border:1px solid #eadbe1;border-radius:12px}.search{width:100%;margin-bottom:10px}.item{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid #eee1e6;border-radius:16px;margin:9px 0}.check{width:23px;height:23px;border:2px solid #e8a4b6;border-radius:50%;cursor:pointer;display:grid;place-items:center}.done .check{background:#e85b7b}.done .check:after{content:"✓";color:#fff;font-size:13px}.main{flex:1}.main strong{display:block}.main small{color:#927b84}.done strong{text-decoration:line-through;color:#9d9095}.del{border:0;background:none;color:#b9a9af;font-size:20px;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.top span{color:#806974}.empty{text-align:center;padding:25px;color:#917b84}.note{text-align:center;font-style:italic;color:#805665;margin:22px}.footer{text-align:center;color:#9b858e}
@media(max-width:650px){.stats{grid-template-columns:1fr}.add{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<section class="hero"><div style="font-size:32px">♡</div><h1>Our Little Adventures</h1><p>A tiny corner of the internet for everything we want to do together.</p></section>
<main class="wrap">
<section id="authCard" class="card auth">
<h2>Our private space ❤️</h2>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="btn" style="width:100%" onclick="signIn()">Log in</button>
<button class="btn alt" style="width:100%;margin-top:8px" onclick="signUp()">Create account</button>
<p id="authMsg" class="msg"></p>
</section>

<section id="app" class="card hidden">
<div class="top"><div><strong>Our bucket list ❤️</strong><br><span id="who"></span></div><button class="btn alt" onclick="signOut()">Log out</button></div>
<div class="stats"><div class="stat"><b id="total">0</b><small>things on our list</small></div><div class="stat"><b id="completed">0</b><small>completed</small></div><div class="stat"><b id="progress">0%</b><small>progress</small></div></div>
<div class="note">“Let’s collect moments, not things.” ♡</div>
<div class="add"><input id="text" placeholder="e.g. Watch a sunrise together 🌅"><select id="category"><option>Travel</option><option>Food</option><option>Adventure</option><option>Date</option><option>Dream</option><option>Other</option></select><button class="btn" onclick="addItem()">Add</button></div>
<input id="search" class="search" placeholder="Search our adventures..." oninput="render()">
<div id="list"></div>
</section>
</main><div class="footer">Made for two. ❤️</div>
<script>
const SUPABASE_URL="https://cwnfdtrroesydrvceewp.supabase.co";
const SUPABASE_KEY="sb_publishable_YVUyOo6IlEfkLdIFNxlTlg_LQHz2bHw";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let items=[], user=null;
const $=id=>document.getElementById(id);
function msg(t){$("authMsg").textContent=t}
async function signUp(){const email=$("email").value.trim(),password=$("password").value;if(!email||password.length<6)return msg("Use an email and a password of at least 6 characters.");const {error}=await db.auth.signUp({email,password});msg(error?error.message:"Account created. Check your email if confirmation is enabled, then log in.");}
async function signIn(){const email=$("email").value.trim(),password=$("password").value;const {error}=await db.auth.signInWithPassword({email,password});if(error)return msg(error.message);msg("")}
async function signOut(){await db.auth.signOut()}
async function load(){const {data,error}=await db.from("bucket_items").select("*").order("created_at",{ascending:false});if(error){alert(error.message);return}items=data||[];render()}
async function addItem(){if(!user)return;const text=$("text").value.trim();if(!text)return;const {error}=await db.from("bucket_items").insert({text,category:$("category").value,completed:false});if(error)alert(error.message);else{$("text").value="";load()}}
async function toggle(id,done){const {error}=await db.from("bucket_items").update({completed:!done}).eq("id",id);if(error)alert(error.message);else load()}
async function removeItem(id){if(!confirm("Remove this adventure?"))return;const {error}=await db.from("bucket_items").delete().eq("id",id);if(error)alert(error.message);else load()}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){const q=$("search").value.toLowerCase();const shown=items.filter(i=>!q||i.text.toLowerCase().includes(q)||i.category.toLowerCase().includes(q));$("list").innerHTML=shown.length?shown.map(i=>`<div class="item ${i.completed?"done":""}"><div class="check" onclick="toggle(${i.id},${i.completed})"></div><div class="main"><strong>${esc(i.text)}</strong><small>${esc(i.category)}</small></div><button class="del" onclick="removeItem(${i.id})">×</button></div>`).join(""):`<div class="empty">Nothing here yet. Add your first adventure. ♡</div>`;const d=items.filter(i=>i.completed).length,t=items.length;$("total").textContent=t;$("completed").textContent=d;$("progress").textContent=t?Math.round(d/t*100)+"%":"0%"}
db.auth.onAuthStateChange(async (_event,session)=>{user=session?.user||null;$("authCard").classList.toggle("hidden",!!user);$("app").classList.toggle("hidden",!user);if(user){$("who").textContent=user.email;await load()}});
(async()=>{const {data}=await db.auth.getSession();if(data.session){user=data.session.user;$("authCard").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=user.email;await load()}})();
$("text").addEventListener("keydown",e=>{if(e.key==="Enter")addItem()});
</script>
</body></html>
